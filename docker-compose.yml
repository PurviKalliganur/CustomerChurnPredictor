version: '3.8'

services:
  # 1. FastAPI Real-Time MLOps Inference Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_ml_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
      - ./ecommerce.db:/app/ecommerce.db
      - ./mlflow.db:/app/mlflow.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - mlops-network

  # 2. Streamlit BI & MLOps Interactive Platform
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: ecommerce_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./ml/artifacts:/app/ml/artifacts
      - ./ecommerce.db:/app/ecommerce.db
      - ./mlflow.db:/app/mlflow.db
    networks:
      - mlops-network

  # 3. MLflow Model Registry & Tracking UI
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce_mlflow_ui
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////app/mlflow.db
      --default-artifact-root /app/mlruns
      --host 0.0.0.0
      --port 5000
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
